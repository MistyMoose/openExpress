name: Bug report
description: Something doesn't work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy:** never paste `openexpress info` output, `GarminDevice.xml`, files from
        `~/Library/Application Support/openexpress` or your e-mail address – use the device report
        instead. On Linux, report to [openExpress](https://github.com/TomaszBojanowski/openExpress/issues).
  - type: textarea
    id: report
    attributes:
      label: Device report
      description: |
        In a terminal:
        `"/Applications/openExpress for Mac.app/Contents/Resources/engine/bin/openexpress" report`
        No device detected? The report still works: it says what is connected over USB.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: What you did, what you expected and any error you saw
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the output of report --log here if something didn't work.
      render: shell
    validations:
      required: false
