# Builds the macOS installer, openExpress-<version>.pkg (macos/scripts/build-pkg.sh), on a
# GitHub-hosted Apple silicon runner, checks it without installing it (verify-pkg.sh), and keeps
# it as an artifact. GPL-3.0-or-later.
#
# Signing: ad hoc unless these repository secrets exist, then Developer ID + notarization:
#   MACOS_CERTIFICATES_P12       base64 of a .p12 with both identities and their private keys:
#                                "Developer ID Application: …" and "Developer ID Installer: …"
#   MACOS_CERTIFICATES_PASSWORD  the .p12's password
#   DEVELOPER_ID_APP             "Developer ID Application: Name (TEAMID)"
#   DEVELOPER_ID_INSTALLER       "Developer ID Installer: Name (TEAMID)"
#   NOTARY_APPLE_ID              the Apple Account that notarizes
#   NOTARY_TEAM_ID               its team ID
#   NOTARY_PASSWORD              an app-specific password of that account (appleid.apple.com)
# Pull requests from forks never see the secrets: they get an ad-hoc build.
#
# The app needs the macOS 26 SDK (Xcode 26 or later; Liquid Glass). The step "Xcode" stops
# the job with an error when the runner's Xcode is older, rather than building something else.
name: macOS package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["macos/**", "openexpress/**", "po/**", "pyproject.toml", ".github/workflows/macos-pkg.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pkg:
    runs-on: macos-26  # Apple silicon (arm64)
    timeout-minutes: 60
    env:
      SIGNING: ${{ secrets.MACOS_CERTIFICATES_P12 != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the build number (commits) and `git describe`

      - name: Xcode
        run: |
          # The newest Xcode on the runner; the macOS 26 SDK at least.
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v beta | sort -V | tail -1 || true)
          [ -n "$latest" ] && sudo xcode-select -s "$latest"
          xcodebuild -version
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK $sdk on $(uname -m)"
          if [ "$(uname -m)" != arm64 ]; then
            echo "::error::This runner is not Apple silicon; the package is arm64 only."; exit 1
          fi
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::The runner's newest SDK is macOS $sdk; openExpress needs the macOS 26 SDK (Xcode 26+). Choose a newer runner image in .github/workflows/macos-pkg.yml."
            exit 1
          fi

      - name: Build tools
        run: brew install xcodegen gettext libusb

      - uses: actions/cache@v4
        with:
          path: macos/build/cache
          key: pkg-downloads-${{ hashFiles('macos/scripts/build-pkg.sh', 'macos/packaging/*-requirements.txt') }}

      - name: Signing keychain
        if: env.SIGNING == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_password=$(uuidgen)
          security create-keychain -p "$kc_password" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_password" "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$kc" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          rm "$RUNNER_TEMP/certs.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_password" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials openexpress-notary --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --keychain "$kc"
          echo "KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Build and verify
        env:
          DEVELOPER_ID_APP: ${{ env.SIGNING == 'true' && secrets.DEVELOPER_ID_APP || '' }}
          DEVELOPER_ID_INSTALLER: ${{ env.SIGNING == 'true' && secrets.DEVELOPER_ID_INSTALLER || '' }}
          NOTARY_PROFILE: ${{ env.SIGNING == 'true' && 'openexpress-notary' || '' }}
        run: macos/scripts/build-pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: openExpress-pkg
          path: macos/build/openExpress-*.pkg
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN"
