# Runs the test suite on macOS, on a GitHub-hosted Apple silicon runner, as docs/macos.md does
# locally: no display and no PyGObject (the tests of the Linux window are skipped), a home
# folder of the tests' own, no USB device. GPL-3.0-or-later.
#
# Python: 3.13, the engine's in the app (macos/scripts/build-pkg.sh), and 3.11, the oldest
# pyproject.toml allows, one after the other in one job: GitHub has few Apple silicon runners,
# and a job waiting for a second one was dropped unstarted. Homebrew gives what the other tests need: gettext and AppStream's
# rules for the translations, libusb for the PTP tests, p7zip for the installer's.
name: macOS tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # One run per branch or pull request: a newer push cancels the run it supersedes, so that the
  # few Apple silicon runners go to the newest commit.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-26  # Apple silicon (arm64)
    timeout-minutes: 30
    env:
      OPENEXPRESS_TESTS_NO_DISPLAY: "1"
      XDG_DATA_DIRS: /opt/homebrew/share  # Homebrew's xgettext does not look there for metainfo.its
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: |
            3.11
            3.13

      - name: Tools
        run: brew install gettext appstream libusb p7zip

      - name: Python packages
        run: |
          # A virtual environment for each Python; --no-deps: PyGObject (pyproject.toml) is
          # only the Linux window's.
          for version in 3.13 3.11; do
            "python$version" -m venv "$RUNNER_TEMP/py$version"
            "$RUNNER_TEMP/py$version/bin/python" -m pip install -q --no-deps -e .
            "$RUNNER_TEMP/py$version/bin/python" -m pip install -q \
                "requests>=2.28" "mutagen>=1.45" "pytest>=7"
          done

      - name: Tests, Python 3.13
        run: '"$RUNNER_TEMP/py3.13/bin/python" -m pytest -q -ra'

      - name: Tests, Python 3.11
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/py3.11/bin/python" -m pytest -q -ra'
