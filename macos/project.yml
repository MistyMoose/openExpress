# The Xcode project of the macOS app, generated by XcodeGen: `xcodegen generate` in this
# folder writes openExpress.xcodeproj (not committed). GPL-3.0-or-later.
name: openExpress
options:
  bundleIdPrefix: io.github.openexpress
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  OpenExpressKit:
    path: OpenExpressKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  openExpress:
    type: application
    platform: macOS
    sources:
      - path: openExpress
        excludes:
          - "AppIcon.icon/**"
      - path: openExpress/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: OpenExpressKit
    info:
      path: openExpress/Info.plist
      properties:
        CFBundleDisplayName: openExpress
        CFBundleName: openExpress
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "openExpress is free software under the GNU GPL v3.0 or later. Not affiliated with Garmin."
    entitlements:
      path: openExpress/openExpress.entitlements
      properties:
        # Not sandboxed: the engine is a separate program that opens USB devices.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.openexpress.mac
        PRODUCT_NAME: openExpress
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      environmentVariables:
        OPENEXPRESS_ENGINE: mock
      testTargets: []
